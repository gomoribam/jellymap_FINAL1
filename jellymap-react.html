<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JellyMap · 부산 바다 해파리 안전 지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#eaf2f5;color:#16384b;font-family:system-ui,'Noto Sans KR',sans-serif}#root{max-width:480px;min-height:100vh;margin:auto;background:#f8fbfc}header,main{padding:18px}header{background:#fff}.brand{font-size:22px;font-weight:800;color:#0a4162}.brand small{display:block;font-size:11px;color:#718494;margin-top:4px}main{padding-top:8px}.status,.card,.detail{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px #dbe7eb}.status{display:flex;justify-content:space-between}.status small{display:block;color:#718494;font-size:10px;margin-top:3px}.status strong{color:#a27609}.map-title{display:flex;justify-content:space-between}.map-title small{display:block;color:#718494;font-size:10px;margin-top:3px}#map{height:480px;border-radius:14px;margin-top:10px}.legend,.note{font-size:10px;color:#718494;padding-top:8px}.legend span{margin-right:7px}.routes{color:#0d78a8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.actions button,.big{border:0;border-radius:13px;padding:14px;font-weight:800}.aid{background:#e84e4e;color:#fff}.guide{background:#e7f6fb;color:#126b8d}.area{display:flex;align-items:center;width:100%;border:1px solid #e2edf1;background:#fff;border-radius:13px;padding:11px;margin:7px 0;text-align:left}.area span{font-size:20px;margin-right:9px}.area div{flex:1}.area b,.area small{display:block}.area small{color:#718494;font-size:10px;margin-top:3px}.back{border:0;background:#eef8fc;color:#0d78a8;padding:9px;border-radius:10px}.detail h1{font-size:22px}.detail p{border-top:1px solid #e4edf1;padding:10px 0;font-size:12px;line-height:1.6}.big{width:100%;font-size:15px;background:#e84e4e;color:#fff}.urgent{background:#fff0ed;border-left:4px solid #e84e4e;padding:12px;font-size:12px;margin:12px 0}.dont{color:#98423a;font-size:12px;line-height:1.8}.jelly{border-top:1px solid #e4edf1;padding:12px 0;font-size:12px}.route-arrow{font-size:22px;color:#0d78a8;background:transparent;border:0}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">
const {useEffect,useRef,useState}=React;const source='국립수산과학원 해파리속보';const sourceUrl='https://www.nifs.go.kr/board/actionBoard0022List.do';const data=[['해운대 앞바다',35.1587,129.1603,'caution','🟡','노무라입깃해파리','오늘 09:20','동남동 → 해안 방향'],['광안리 앞바다',35.1532,129.1187,'caution','🟡','보름달물해파리','오늘 08:40','동쪽 → 외해 방향'],['다대포 앞바다',35.048,128.966,'danger','🔴','작은부레관해파리','오늘 07:55','남동쪽 → 해안 접근'],['송정 해수욕장',35.178,129.199,'safe','🟢','보름달물해파리','어제 17:20','동쪽 → 외해 방향'],['기장·일광 해역',35.265,129.25,'caution','🟡','보름달물해파리','오늘 08:05','남서쪽 → 해안 접근']];const labels={safe:'안전',caution:'주의',danger:'위험'};
function App(){const[screen,setScreen]=useState('map'),[selected,setSelected]=useState(null),ref=useRef(null),map=useRef(null);useEffect(()=>{if(map.current)return;map.current=L.map(ref.current).setView([35.16,129.15],10.5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map.current);data.forEach((d,i)=>{const c=d[3]=='danger'?'#e84e4e':d[3]=='caution'?'#e8b63d':'#20ad81';L.circleMarker([d[1],d[2]],{radius:10,fillColor:c,color:'#fff',weight:3,fillOpacity:1}).addTo(map.current).on('click',()=>{setSelected(i);setScreen('detail')});const end=[d[1]+.018,d[2]+.025];L.polyline([[d[1]-.018,d[2]-.025],[d[1],d[2]],end],{color:c,weight:3,dashArray:'8 7'}).addTo(map.current);L.marker([d[1],d[2]],{interactive:false,icon:L.divIcon({className:'route-arrow',html:'➤'})}).addTo(map.current)})},[]);if(screen==='aid')return <><Header back={()=>setScreen('map')}/><main><div className="detail"><h1>해파리에 쏘였을 때</h1><ol><li>물 밖의 안전한 곳으로 이동</li><li>주변 사람이나 안전요원에게 도움 요청</li><li>촉수는 맨손으로 만지지 말고 조심스럽게 제거</li><li>바닷물로 씻고 증상 관찰</li></ol><div className="urgent"><b>심한 통증·호흡곤란·의식저하가 있으면 즉시 119</b><p>전신 두드러기, 구토, 어지럼증 등도 의료기관의 도움을 받으세요.</p></div><h2>하면 안 되는 행동</h2><ul className="dont"><li>상처를 문지르거나 긁지 않기</li><li>맨손으로 촉수 만지지 않기</li><li>수돗물·알코올·식초를 임의로 사용하지 않기</li></ul><p className="note">이 정보는 의료 진단이나 치료를 대신하지 않습니다.</p></div></main></>;if(screen==='guide')return <><Header back={()=>setScreen('map')}/><main><div className="detail"><h1>부산에서 볼 수 있는 해파리</h1>{['노무라입깃해파리','보름달물해파리','작은부레관해파리'].map(x=><div className="jelly"><b>{x}</b><p>시연용 설명입니다. 정확한 종류와 위험성은 공식 관측 자료 및 전문가 확인이 필요합니다.</p></div>)}</div></main></>;if(screen==='detail'){const d=data[selected];return <><Header back={()=>setScreen('map')}/><main><div className="detail"><h1>{d[4]} {d[0]}</h1><p><b>현재 위험도: {labels[d[3]]}</b></p><p><b>최근 관측</b><br>{d[6]} · 관측 정보 예시</p><p><b>관측된 해파리</b><br>{d[5]}</p><p><b>관측 정도</b><br>{d[3]=='danger'?'다량':'낮음'}</p><p><b>현재 이동 방향</b><br>{d[7]}</p><p className="routes"><b>예상 이동경로</b><br>현재 위치 → 예상 1시간 후 → 예상 3시간 후<br>시연용 예상 방향이며 실시간 해류 예측이 아닙니다.</p><p><b>위험도 전망</b><br>{d[3]=='danger'?'위험도가 높아질 가능성이 있습니다.':'현재 수준이 유지될 것으로 예상됩니다.'}</p><p><b>이용자 권고</b><br>{d[3]=='danger'?'입수 자제':'주의 필요 · 현장 안내 확인'}</p><p className="note">젤리맵 위험도는 공개 자료를 앱에서 단순화한 단계입니다. 현재 데이터는 시연용 예시 데이터입니다.</p></div><button className="big" onClick={()=>setScreen('aid')}>응급처치 보기</button></main></>};return <><Header/><main><div className="status"><div><b>부산 해파리 현황</b><small>시연용 예시 데이터 · 2026.08.12 기준</small></div><strong>🟡 주의</strong></div><div className="card"><div className="map-title"><div><b>부산 해안·앞바다</b><small>기장 · 송정 · 해운대 · 광안리 · 다대포</small></div></div><div id="map" ref={ref}></div><div className="legend">해파리 위험도　🟢 안전　🟡 주의　🔴 위험</div><div className="routes">➝ 점선과 화살표는 시연용 예상 이동 방향입니다.</div></div><div className="actions"><button className="aid" onClick={()=>setScreen('aid')}>✚ 응급처치</button><button className="guide" onClick={()=>setScreen('guide')}>▧ 해파리 종류 보기</button></div><h2>부산 주요 관측 지역</h2>{data.map((d,i)=><button className="area" onClick={()=>{setSelected(i);setScreen('detail')}}><span>{d[4]}</span><div><b>{d[0]}</b><small>{d[6]} · {d[5]}</small></div>›</button>)}<footer className="note">자료 출처: <a href={sourceUrl} target="_blank">{source}</a><br/>현재 화면은 시연용 예시 데이터입니다.</footer></main></>};function Header({back}){return <header>{back?<button className="back" onClick={back}>← 부산 해파리 지도</button>:<><div className="brand">🪼 JellyMap</div><small>부산 바다 해파리 안전 지도</small></>}</header>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
